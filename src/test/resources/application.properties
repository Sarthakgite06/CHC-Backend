spring.application.name=CentralizedHealthCard-Test

## In-Memory Database for Fast & Isolated Unit/Context Tests
spring.datasource.url=jdbc:h2:mem:chc_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

## JWT Configuration ##
jwt.secret=YourSuperSecretKeyThatIsAtLeast64BytesLongForHMACSHA512AlgorithmSecurityPurpose2026!

## Disable Spring AI during tests if no key ##
spring.ai.openai.api-key=test-key-placeholder

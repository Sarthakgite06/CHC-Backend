spring.application.name=CentralizedHealthCard

## Active Profile ##
spring.profiles.active=${SPRING_PROFILES_ACTIVE:prod}

## Database Configuration (PostgreSQL - Neon) ##
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-withered-butterfly-b59f1tg3.c-7.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_jZmUzt8X6lfR}
spring.datasource.driver-class-name=org.postgresql.Driver

## HikariCP Connection Pool Optimization ##
spring.datasource.hikari.initialization-fail-timeout=0
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

## Custom Port No. ##
server.port=${PORT:8081}

## Actuator ##
management.endpoints.web.exposure.include=health,info

## JWT Configuration ##
jwt.secret=${JWT_SECRET:YourSuperSecretKeyThatIsAtLeast64BytesLongForHMACSHA512AlgorithmSecurityPurpose2026!}

## SPRING AI (Using Gemini via OpenAI compatibility) ##
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.api-key=${GEMINI_API_KEY:temp-key-placeholder}
spring.ai.openai.chat.options.model=gemini-2.5-flash
spring.ai.openai.chat.options.temperature=0.3

## Multipart Configuration (50MB Limit) ##
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

spring.application.name=CentralizedHealthCard

## Active Profile ##
spring.profiles.active=dev

## Database Configuration ##
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chc_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

## JPA ##
#spring.jpa.hibernate.ddl-auto=update
#spring.jpa.show-sql=false

## Custom Port No. ##
server.port=8081

## Actuator ##
management.endpoints.web.exposure.include=*

## JWT Configuration ##
jwt.secret=YourSuperSecretKeyThatIsAtLeast64BytesLongForHMACSHA512AlgorithmSecurityPurpose2026!

## SPRING AI (Using Gemini via OpenAI compatibility) ##
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.api-key=${GEMINI_API_KEY:temp-key-placeholder}
spring.ai.openai.chat.options.model=gemini-2.5-flash
spring.ai.openai.chat.options.temperature=0.3

## Multipart Configuration (50MB Limit) ##
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

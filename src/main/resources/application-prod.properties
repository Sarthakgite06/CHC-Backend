spring.datasource.driver-class-name=org.postgresql.Driver

## HikariCP Pool for Render Production ##
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000

## JPA / Hibernate ##
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

## Port ##
server.port=${PORT:8081}

## Actuator ##
management.endpoints.web.exposure.include=health,info

## JWT Configuration ##
jwt.secret=${JWT_SECRET:YourSuperSecretKeyThatIsAtLeast64BytesLongForHMACSHA512AlgorithmSecurityPurpose2026!}

## SPRING AI (Gemini) ##
spring.ai.openai.base-url=https://generativelanguage.googleapis.com/v1beta/openai/
spring.ai.openai.api-key=${GEMINI_API_KEY:temp-key-placeholder}
spring.ai.openai.chat.options.model=gemini-2.5-flash
spring.ai.openai.chat.options.temperature=0.3

## File Upload (50MB) ##
